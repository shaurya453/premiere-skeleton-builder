name: Build apps

# PyInstaller cannot cross-compile, so each platform is built on its own runner.
# Run from the Actions tab ("Run workflow") or push a tag like v1.0.0.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write  # needed to publish/update the rolling "latest" release the app updates from

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-14        # Apple Silicon; runs on Intel Macs too via Rosetta 2
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.8
      - name: Compile PyInstaller's bootloader from source (Windows)
        # The bootloader is the stub every PyInstaller exe starts with, and the prebuilt copy that
        # ships on PyPI is the same file in thousands of programs, so antivirus engines have learned
        # to distrust it (the "Trojan:Win32/Bearfoos.A!ml" / "Static AI - Suspicious PE" family of
        # false positives). Building it on this runner gives our exe a stub nobody has fingerprinted.
        # The sdist ships a prebuilt Windows bootloader too, so PYINSTALLER_COMPILE_BOOTLOADER is
        # what forces the compile; the step fails if the file did not actually change.
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          $loader = python -c "import PyInstaller, pathlib; print(pathlib.Path(PyInstaller.__file__).parent / 'bootloader' / 'Windows-64bit-intel' / 'runw.exe')"
          $before = (Get-FileHash $loader -Algorithm SHA256).Hash
          pip install --force-reinstall --no-deps --no-binary pyinstaller pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { throw "Compiling the PyInstaller bootloader failed" }
          $after = (Get-FileHash $loader -Algorithm SHA256).Hash
          Write-Host "prebuilt bootloader:  $before"
          Write-Host "compiled bootloader:  $after"
          if ($before -eq $after) { throw "The bootloader is still the prebuilt one" }
      - name: Run tests
        run: python -m unittest discover tests
      - name: Build app
        shell: bash
        run: python build_app.py --node "$(node -p 'process.execPath')"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SkeletonBuilder -DestinationPath "SkeletonBuilder-${{ matrix.name }}.zip"
      - name: Scan the Windows build with Defender (informational only)
        # Shows in the log whether Microsoft Defender flags this build before it is published.
        # Never blocks the release: the runner's cloud protection can differ from a user's PC.
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Start-MpScan -ScanType CustomScan -ScanPath "$PWD\dist\SkeletonBuilder"
          $found = Get-MpThreatDetection
          if ($found) {
            $found | Format-List ThreatID, Resources
            Get-MpThreat | Format-List ThreatName, SeverityID
            Write-Warning "Defender flagged this build"
          } else {
            Write-Host "Defender found nothing in dist/SkeletonBuilder"
          }
      - name: Package (macOS)
        if: runner.os == 'macOS'
        # PyInstaller's --windowed onedir build produces both the .app bundle and a plain
        # onedir folder of the same content (dist/Premiere Skeleton Builder, no .app suffix) -
        # only the .app is meant to ship. `ditto -c` can't archive multiple sources in one
        # call, so drop the duplicate and archive dist/ itself (without --keepParent, which
        # flattens a single source's contents to the archive root) rather than naming the
        # .app alone, so the default Projects/Media/Models/Cache/Temp folders build_app.py
        # ships beside it come along too.
        run: |
          rm -rf "dist/Premiere Skeleton Builder"
          ditto -c -k dist "SkeletonBuilder-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SkeletonBuilder-${{ matrix.name }}
          path: SkeletonBuilder-${{ matrix.name }}.zip
      - name: Publish to the rolling "latest" release
        # The app's in-app updater fetches from a GitHub Release, not an Actions artifact -
        # artifacts require an authenticated token to download even on a public repo, so a
        # shipped app has no way to fetch one. Releases are public and unauthenticated. Gated
        # to main so a stray branch build never overwrites what editors update to.
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" --title "Latest build" \
              --notes "commit:${{ github.sha }}" --target "${{ github.sha }}" || true
          gh release edit latest --repo "$GITHUB_REPOSITORY" --notes "commit:${{ github.sha }}" --target "${{ github.sha }}"
          gh release upload latest --repo "$GITHUB_REPOSITORY" "SkeletonBuilder-${{ matrix.name }}.zip" --clobber
